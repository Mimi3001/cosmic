<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Landscape Builder</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.11.7/p5.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/FresnelShader.js"></script>
  <link rel="stylesheet" href="../../ui.css">
  <link rel="stylesheet" type="text/css" href="style.css">
  <script src="sketchFl.js"></script>
</head>

<body>
<div class="mg-prompt" id="mg-prompt" aria-live="polite"></div>
<div class="mg-root">
  <div style="margin-bottom: 10px; margin-left: 5px;">
    <button id="treeBtn" class="ui-button">Trees</button>
    <button id="flowerBtn" class="ui-button">Flowers</button>
    <button id="randomizeColorsBtn" class="ui-button">Randomize Colors</button>
  </div>

  <div style="margin-bottom: 10px; margin-left: 5px;">
    <label class="ui-label">Size: <input type="range" class="ui-range" id="sizeSlider" min="20" max="80" value="20" /></label>
    <label class="ui-label">Details: <input type="range" class="ui-range" id="detailSlider" min="5" max="12" value="5" /></label>
    <label class="ui-label">Height: <input type="range" class="ui-range" id="heightSlider" min="30" max="100" value="30" /></label>
  </div>

</div>
</body>

</html>
