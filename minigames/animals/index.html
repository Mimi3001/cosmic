<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Landscape Builder</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.11.7/p5.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/FresnelShader.js"></script>
    <link rel="stylesheet" href="../../ui.css">
    <link rel="stylesheet" type="text/css" href="style.css">
    <script src="sketch.js"></script>
</head>

<body>
    <div class="mg-prompt" id="mg-prompt" aria-live="polite"></div>
    <div class="mg-root">
        <div class="flora-tools">
            <button class="flora-tools-toggle ui-button">Tools</button>

            <div class="flora-tools-panel">
                <div class="flora-buttons">
                    <button id="aBtn" class="ui-button">1</button>
                    <button id="bBtn" class="ui-button">2</button>
                    <button id="cBtn" class="ui-button">3</button>
                    <button id="randomizeAnimals" class="ui-button">Randomize</button>
                </div>

                <div class="flora-sliders">
                    <label>Size
                        <input type="range" id="sizeSlider" min="20" max="80" value="20">
                    </label>
                </div>

            </div>
        </div>


    </div>
</body>

</html>
