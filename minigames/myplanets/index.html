<body>
  <div class="mg-prompt" id="mg-prompt" aria-live="polite"></div>
  <div class="mg-root">
    <div class="terrain-tools">

      <button class="terrain-tools-toggle ui-button" data-el="Χειριστήρια">Controls</button>

      <div id="controls" class="terrain-sliders terrain-tools-panel">

        <label>
          <span data-el="Υψόμετρικό επίπεδο">Terrain Height</span>
          <input type="range" id="heightSlider" class="ui-range" min="0" max="0.1" step="0.001" value="0">
        </label>

        <label>
          <span data-el="Αμοσφαιρικό επίπεδο">Atmosphere Level</span>
          <input type="range" id="cloudSlider" class="ui-range" min="0.0" max="1" step="0.01" value="0.5">
        </label>

        <label>
          <span data-el="Επίπεδα νερού">Water Amount</span>
          <input type="range" id="waterSlider" class="ui-range" min="0" max="0.8" step="0.001" value="0.06">
        </label>

      </div>
    </div>


    <canvas id="threeCanvas"></canvas>
  </div>

</body>
