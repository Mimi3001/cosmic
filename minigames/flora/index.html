<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Landscape Builder</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.11.7/p5.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/FresnelShader.js"></script>
    <link rel="stylesheet" type="text/css" href="style.css">
    <script src="sketchFl.js"></script>
</head>

<body>
  <div style="margin-bottom: 10px;">
    <button id="treeBtn">Tree</button>
    <button id="flowerBtn">Flower</button>
    <button id="randomizeColorsBtn">Randomize Colors</button>
  </div>

  <div style="margin-bottom: 10px;">
    <label>Size: <input type="range" id="sizeSlider" min="20" max="100" value="20" /></label>
    <label>Twigs & Petals: <input type="range" id="detailSlider" min="5" max="12" value="5" /></label>
    <label>Height: <input type="range" id="heightSlider" min="30" max="100" value="30" /></label>
  </div>
  
    
  </body>
</html>
