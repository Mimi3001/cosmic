<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="utf-8" />
	<script src="https://cdn.jsdelivr.net/npm/p5@1.11.7/lib/p5.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/p5@1.11.7/lib/addons/p5.sound.min.js"></script>
	<!-- ML5 v1 HandPose — must load after p5 -->
	<script src="https://unpkg.com/ml5@1/dist/ml5.js"></script>
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="../../ui.css">
	<link rel="stylesheet" type="text/css" href="style.css">
	<!-- Handpose controller — loads before mySketch so functions exist at preload/setup time -->
	<script src="handpose-control.js"></script>
	<script src="mySketch.js"></script>
</head>

<body>
	<div class="mg-prompt" id="mg-prompt" aria-live="polite"></div>
	<div class="mg-root">
    <div class="handpose-strip" id="handpose-strip">
        <span class="strip-label strip-hot" data-el="Ζέστη" data-en="Hot">Ζέστη</span>
        <div class="strip-middle">
           <!-- <span class="strip-title" data-el="Εύρος Θερμοκρασίας" data-en="Temperature Range">Εύρος Θερμοκρασίας</span>-->
            <div class="strip-cam" id="strip-cam"></div>
            <input type="range" id="hueSlider" class="strip-slider" min="0" max="4" step="0.25" value="2">
        </div>
        <span class="strip-label strip-cold" data-el="Κρύο" data-en="Cool">Κρύο</span>
    </div>
</div>

</body>

</html>
