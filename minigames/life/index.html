<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Landscape Builder</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.11.7/p5.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/FresnelShader.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../ui.css">
    <link rel="stylesheet" type="text/css" href="style.css">
    <script src="world.js"></script>
</head>

<body>
    <div class="mg-prompt" id="mg-prompt" aria-live="polite"></div>
    <div class="mg-root">
        <div class="life-tools-container">
            <div class="flora-tools">
                <button class="flora-tools-toggle ui-button" data-el="Χειριστήρια">Controls</button>

                <div class="flora-tools-panel">
                    <div class="flora-buttons">
                        <button id="flowerBtn" class="ui-button" data-el="Φυτά">Plants</button>
                        <button id="treeBtn" class="ui-button" data-el="Δέντρα">Trees</button>
                        <button id="randomizeColorsBtn" class="ui-button" data-el="Τυχαία χρώματα">Randomize</button>
                    </div>

                    <div class="flora-sliders">
                        <label>
                            <span data-el="Μέγεθος">Size</span>
                            <input type="range" id="sizeSlider" min="20" max="80" value="20">
                        </label>
                        <label>
                            <span data-el="Λεπτομέρεια">Detail</span>
                            <input type="range" id="detailSlider" min="3" max="12" value="3">
                        </label>
                        <label>
                            <span data-el="Ύψος">Height</span>
                            <input type="range" id="heightSlider" min="30" max="100" value="30">
                        </label>
                    </div>
                </div>
            </div>
            <div class="animal-tools ">
                <button class="animal-tools-toggle ui-button" data-el="Χειριστήρια">Controls</button>
                <div class="animal-tools-panel">

                    <div class="animal-buttons">
                        <button data-animal="mammal" class="ui-button" data-el="Θηλαστικά">Mammals</button>
                        <button data-animal="insect" class="ui-button" data-el="Έντομα">Bugs</button>
                        <button data-animal="reptile/ave/fish" class="ui-button" data-el="Μη θηλαστικά">Non
                            mammals</button>

                    </div>

                    <div class="animal-sliders">
                        <label>
                            <span data-el="Μέγεθος">Size</span>
                            <input type="range" id="animalSizeSlider" min="10" max="60" value="20">
                        </label>
                    </div>
                </div>
            </div>
        </div>

        <div class="civil-tools">
            <button class="civil-tools-toggle ui-button" data-el="Χειριστήρια">Controls</button>
            <div class="civil-tools-panel">

                <div class="civil-buttons">
                    <button data-civil="human" class="ui-button" data-el="Άνθρωποι">humans</button>
                    <button data-civil="house" class="ui-button" data-el="Σπίτια">houses</button>
                    <button data-civil="production" class="ui-button" data-el="Εργοστάσια">factories</button>
                </div>

                <div class="civil-sliders">
                    <label>
                        <span data-el="Πλήθος">Detail</span>
                        <input type="range" id="detailCivilSlider" min="1" max="18" value="3">
                    </label>
                </div>
            </div>
        </div>
        <!--
            <div class="tool-group">
                <button data-animal="mammal">mammals</button>
                <button data-animal="incect">bugs</button>
                <button data-animal="reptile/ave/fish">other</button>
            </div>

            <div class="tool-group">
                <label>Size</label>
                <input id="animalSizeSlider" type="range" min="10" max="60" value="30">
            </div>

            <div class="tool-group">
                <button id="animalRandomize">Randomize Look</button>
            </div>
            <div class="human-tools hidden"></div>
            -->
    </div>
</body>

</html>
