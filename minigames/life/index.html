<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Landscape Builder</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.11.7/p5.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/FresnelShader.js"></script>
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../ui.css">
    <link rel="stylesheet" type="text/css" href="style.css">
    <script src="world.js"></script>
</head>

<body>
    <div class="mg-prompt" id="mg-prompt" aria-live="polite"></div>
    <div class="mg-root">
        <div class="life-tools-container">
            <div class="flora-tools">
            <button class="flora-tools-toggle ui-button">Controls</button>

            <div class="flora-tools-panel">
                <div class="flora-buttons">
                    <button id="treeBtn" class="ui-button">Trees</button>
                    <button id="flowerBtn" class="ui-button">Flowers</button>
                    <button id="randomizeColorsBtn" class="ui-button">Randomize</button>
                </div>

                <div class="flora-sliders">
                    <label>Size
                        <input type="range" id="sizeSlider" min="20" max="80" value="20">
                    </label>

                    <label>Detail
                        <input type="range" id="detailSlider" min="3" max="12" value="3">
                    </label>

                    <label>Height
                        <input type="range" id="heightSlider" min="30" max="100" value="30">
                    </label>
                </div>
            </div>
            </div>
            <div class="animal-tools ">
            <button class="animal-tools-toggle ui-button">Controls</button>
            <div class="animal-tools-panel">

                <div class="animal-buttons">
                    <button data-animal="mammal" class="ui-button">Mammals</button>
                    <button data-animal="insect" class="ui-button">Bugs</button>
                    <button data-animal="reptile/ave/fish" class="ui-button">Non mammals</button>
                  <!--  <button id="animalRandomBtn" class="ui-button">Randomize</button>-->
                </div>

                <div class="animal-sliders">
                    <label>Size
                        <input type="range" id="animalSizeSlider" min="10" max="60" value="20">
                    </label>
                </div>
            </div>
            </div>
        </div>
        <div class="civil-tools">
            <button class="civil-tools-toggle ui-button">Controls</button>
            <div class="civil-tools-panel">

                <div class="civil-buttons">
                    <button data-civil="human" class="ui-button">humans</button>
                    <button data-civil="house" class="ui-button">houses</button>
                    <button data-civil="production" class="ui-button">factories</button>
                </div>

                <div class="civil-sliders">
                    <label>Detail
                        <input type="range" id="detailCivilSlider" min="3" max="21" value="3">
                    </label>
                </div>
            </div>
        </div>
        <!--
            <div class="tool-group">
                <button data-animal="mammal">mammals</button>
                <button data-animal="incect">bugs</button>
                <button data-animal="reptile/ave/fish">other</button>
            </div>

            <div class="tool-group">
                <label>Size</label>
                <input id="animalSizeSlider" type="range" min="10" max="60" value="30">
            </div>

            <div class="tool-group">
                <button id="animalRandomize">Randomize Look</button>
            </div>
            <div class="human-tools hidden"></div>
            -->
    </div>
</body>

</html>
